server {
    listen 80 default_server;
    server_name _;
    return 404;
}
server {
    listen 80;
    server_name pandadoddo.ru;
    root /srv/current/landing;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    location = /api/public/tenants { include /etc/nginx/rline-fastcgi.conf; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
server {
    listen 80;
    server_name "~^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.pandadoddo\.ru$";
    root /srv/current/frontend;
    client_max_body_size 24m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
    location ~ ^/(api|auth|sanctum)(/|$) { include /etc/nginx/rline-fastcgi.conf; }
    location = /up { include /etc/nginx/rline-fastcgi.conf; }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
    location ~ \.php$ { return 404; }
    location ~ ^/(internal|docs)(/|$) { return 404; }
}
server {
    listen 8080;
    server_name _;
    location = /internal/tls-allowed { include /etc/nginx/rline-fastcgi.conf; }
    location / { return 404; }
}
