name: rline-production
x-app: &app
  image: rline-api:${RELEASE:?Set RELEASE}
  build:
    context: ./backend
    dockerfile: deploy/production/Dockerfile
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
services:
  app:
    <<: *app
  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=2", "--tries=3", "--timeout=90", "--max-time=3600"]
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./fastcgi.conf:/etc/nginx/rline-fastcgi.conf:ro
      - ./backend/public:/var/www/html/public:ro
      - ./releases:/srv/releases:ro
      - ./current:/srv/current:ro
    depends_on: [app]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [gateway]
volumes:
  postgres:
  storage:
  caddy_data:
  caddy_config:
