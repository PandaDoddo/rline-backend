map $host $stand {
    default "";
    main.rline.test main;
    testing.rline.test testing;
    demo.rline.test demo;
}

server {
    listen 80 default_server;
    server_name _;
    location = /stand-health { return 200 "ok\n"; }
    location / { return 444; }
}

server {
    listen 80;
    server_name main.rline.test testing.rline.test demo.rline.test;
    root /srv/stands/$stand;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 20m;
    open_file_cache off;

    location ~ ^/(api|auth|sanctum|docs|vendor/stoplight-elements|up)(/|$) {
        set $backend nginx:80;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-RLine-Stand "";
    }

    # Versioned URLs keep lazy imports in already opened tabs working after promotion.
    location ^~ /releases/ {
        root /srv;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location = /__release.json {
        try_files /release.json =503;
        add_header Cache-Control "no-store" always;
    }
    location = /index.html {
        try_files $uri =503;
        add_header Cache-Control "no-store" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
    location ~ /\. { deny all; }
}
